name: Android release

# Builds signed AABs for Play upload.
#
# PLAY_STORE_SUBMISSION.md documents a fully manual build/sign/upload process,
# which is easy to get wrong under time pressure — 111568a shipped an unsigned
# wear AAB that Play rejected, exactly the failure this workflow prevents.
#
# Trigger by pushing a tag: `git tag v1.0.8 && git push origin v1.0.8`.
# workflow_dispatch is available for dry runs without cutting a tag.
#
# This does NOT upload to Play. It produces verified, signed artifacts and
# leaves the actual submission (release notes, staged rollout percentage,
# Data Safety review) as a deliberate human step.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_signing:
        description: 'Build unsigned (no keystore secrets required)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    name: Build release bundles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Windows checkouts don't preserve the exec bit, so it can get dropped
      # again by a future commit. Cheap guard — losing it fails with a bare
      # "exit 126" that reads like a Gradle problem rather than a file mode.
      - name: Ensure wrapper is executable
        run: chmod +x gradlew

      # Gate the release on the same checks main uses. A tag should never
      # produce an artifact that wouldn't have passed CI.
      - name: Verify (tests, format, lint)
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/gradle-with-diag.sh" /tmp/verify.log \
            :core:test :app:testDebugUnitTest :wear:testDebugUnitTest \
            ktlintCheck :app:lintDebug :wear:lintRelease

      # app/build.gradle.kts and wear/build.gradle.kts read
      # `keystore.properties` from the repo root and silently skip signing if
      # it's absent — which yields an AAB Play rejects. Reconstruct it from
      # secrets so the artifacts are actually signed.
      - name: Restore signing keystore
        if: ${{ !inputs.skip_signing }}
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is not set. Add the four"\
                 "UPLOAD_* repository secrets, or re-run with skip_signing."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/upload-keystore.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release bundles
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/gradle-with-diag.sh" /tmp/bundle.log \
            :app:bundleRelease :wear:bundleRelease

      # An unsigned AAB builds successfully and only fails at upload time.
      # Fail here instead, where the message is actionable.
      - name: Verify bundles are signed
        if: ${{ !inputs.skip_signing }}
        run: |
          set -e
          for aab in app/build/outputs/bundle/release/app-release.aab \
                     wear/build/outputs/bundle/release/wear-release.aab; do
            if [ ! -f "$aab" ]; then
              echo "::error::Missing expected bundle: $aab"; exit 1
            fi
            if ! unzip -l "$aab" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)'; then
              echo "::error::$aab is NOT signed — keystore.properties was"\
                   "probably not picked up. Play will reject this."
              exit 1
            fi
            echo "signed OK: $aab ($(du -h "$aab" | cut -f1))"
          done

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Release artifacts"
            echo
            echo "| Bundle | Size |"
            echo "|---|---|"
            for aab in app/build/outputs/bundle/release/app-release.aab \
                       wear/build/outputs/bundle/release/wear-release.aab; do
              [ -f "$aab" ] && echo "| \`$(basename "$aab")\` | $(du -h "$aab" | cut -f1) |"
            done
            echo
            echo "versionName: $(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
            echo "versionCode: $(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)"
            echo
            echo "Upload via Play Console — see PLAY_STORE_SUBMISSION.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/wear/build/outputs/bundle/release/*.aab
            android/wear/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      # Never leave the signing material on the runner, even on failure.
      - name: Scrub signing material
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/upload-keystore.jks" "$GITHUB_WORKSPACE/keystore.properties"
