name: Android tests

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-tests.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-tests.yml'
      - '.github/scripts/**'

# Cancel any in-flight run for the same branch when a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pre-empt the Sept 2026 Node 20 → Node 24 forced upgrade. The actions
# we depend on still ship Node 20 binaries; this env var asks the
# runner to invoke them under Node 24 today. Drop once each action
# publishes a Node 24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is a committed binary, so verify it matches a known-good
      # Gradle release checksum before executing it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      # No gradle-version here on purpose: the steps below invoke ./gradlew, so
      # the version comes from the checked-in wrapper and can't drift from what
      # developers run locally. This action still provides the dependency cache.
      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # Windows checkouts don't preserve the exec bit, so it can get dropped
      # again by a future commit. Cheap guard — losing it fails with a bare
      # "exit 126" that reads like a Gradle problem rather than a file mode.
      - name: Ensure wrapper is executable
        run: chmod +x gradlew

      # The test task implicitly compiles main + test, so any Kotlin
      # compile error surfaces here. The wrapper script tees stdout to
      # /tmp/*.log and runs print-kotlin-errors.sh on failure so the
      # e:/error: lines appear inline, as ::error:: annotations, and
      # in the run summary.
      - name: Run :core unit tests
        run: bash "$GITHUB_WORKSPACE/.github/scripts/gradle-with-diag.sh" /tmp/core.log :core:test

      - name: Run :app unit tests
        run: bash "$GITHUB_WORKSPACE/.github/scripts/gradle-with-diag.sh" /tmp/app.log :app:testDebugUnitTest

      - name: Run :wear unit tests
        run: bash "$GITHUB_WORKSPACE/.github/scripts/gradle-with-diag.sh" /tmp/wear.log :wear:testDebugUnitTest

      # ktlint. No baseline — the codebase is formatted, so any deviation here
      # is newly introduced.
      - name: Check formatting (ktlint)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/gradle-with-diag.sh" /tmp/ktlint.log ktlintCheck

      # Coverage. Only :core is gated (80% instruction, currently ~86%); it
      # holds the pure logic worth enforcing a bound on. :app reports without
      # a threshold — see the reasoning in app/build.gradle.kts.
      - name: Check coverage (:core)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/gradle-with-diag.sh" /tmp/kover.log :core:koverVerify :core:koverXmlReport

      # Android Lint. Configured in app/build.gradle.kts with abortOnError, so
      # any Lint *error* fails the build. Catches the accessibility, permission,
      # and API-level problems that nothing else in CI was looking for.
      - name: Run Android Lint
        run: bash "$GITHUB_WORKSPACE/.github/scripts/gradle-with-diag.sh" /tmp/lint.log :app:lintDebug :wear:lintRelease

      # Release variant only runs R8 here. Without this, ProGuard-rule breakage
      # (e.g. a kotlinx.serialization class getting stripped) would not surface
      # until someone built an AAB by hand for a Play upload.
      - name: Build release (R8 + resource shrinking)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/gradle-with-diag.sh" /tmp/release.log :app:assembleRelease :wear:assembleRelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/tests/
            android/wear/build/reports/tests/
            /tmp/*.log
          retention-days: 14

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.sarif
            android/wear/build/reports/lint-results-*.html
          retention-days: 14

  # Instrumented tests need an emulator, which doubles CI time and is
  # flaky on the free runners. Kept as a separate workflow file
  # (android-instrumented-tests.yml) so it can be triggered manually
  # or scheduled nightly without blocking PRs.
