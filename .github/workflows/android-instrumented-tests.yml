name: Android instrumented tests

# Heavy — runs the emulator. Triggered manually or on a schedule so it
# doesn't gate every PR.
on:
  workflow_dispatch:
  schedule:
    # 04:00 UTC nightly.
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  emulator-tests:
    name: Pixel 6 + Pixel Tablet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    strategy:
      fail-fast: false
      matrix:
        device: [pixel6Api34, pixelTabletApi34]
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The wrapper jar is a committed binary, so verify it matches a known-good
      # Gradle release checksum before executing it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      # Snapshot generation for Gradle Managed Devices is the flaky part on
      # hosted runners: the emulator sometimes "closes unexpectedly (1)" while
      # booting to create its snapshot, failing the `<device>Setup` task before
      # any test runs. Run Setup on its own with a clean-and-retry loop so a
      # transient boot crash retries automatically — while real test failures
      # (the separate step below) are never retried and never masked.
      - name: Prepare emulator snapshot (retry flaky boot)
        run: |
          for attempt in 1 2 3; do
            echo "=== Emulator setup attempt $attempt/3 ==="
            if gradle :app:${{ matrix.device }}Setup --stacktrace; then
              echo "Emulator snapshot ready on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Emulator setup failed after 3 attempts."
              exit 1
            fi
            echo "Setup attempt $attempt failed; wiping managed-device AVDs before retry."
            gradle :app:cleanManagedDevices --stacktrace || true
            rm -rf "$HOME/.android/avd"/* "$HOME/.config/.android/avd"/* 2>/dev/null || true
          done

      # Snapshot is now created and up-to-date, so this reuses it and does not
      # re-boot from cold. A failure here is a genuine test failure.
      - name: Run instrumented tests via Gradle Managed Devices
        run: gradle :app:${{ matrix.device }}DebugAndroidTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-${{ matrix.device }}
          path: android/app/build/reports/androidTests/
          retention-days: 14
